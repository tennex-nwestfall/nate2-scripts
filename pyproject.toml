[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nate2-scripts"
version = "1.0.3"
description = "Utility scripts for AWS development on macOS"
requires-python = ">=3.11"
dependencies = [
    "argcomplete",
    "boto3",
]

[project.scripts]
console = "nate2_scripts.console:main"
bing-wrapper = "nate2_scripts.bing_wrapper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nate2_scripts"]

[tool.hatch.build.targets.wheel.force-include]
"src/nate2_scripts/bing_wrapper/autocomplete.sh" = "nate2_scripts/bing_wrapper/autocomplete.sh"

[project.optional-dependencies]
dev = [
    "boto3-stubs[essential]",
    "moto[all]",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolver test modules are named after the service they cover (s3.py, logs.py,
# ...) rather than test_*.py, so widen collection to any module under tests/.
python_files = ["*.py"]

[project.urls]
Homepage = "https://github.com/tennex-nwestfall/nate2-scripts"